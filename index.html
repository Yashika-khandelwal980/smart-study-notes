
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Study Notes</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:#f4f4ff;
padding:20px;
}

.container{
max-width:900px;
margin:auto;
}

h1{
text-align:center;
color:#6C3EF4;
margin-bottom:20px;
}

.form{
background:white;
padding:20px;
border-radius:12px;
box-shadow:0 5px 15px rgba(0,0,0,.1);
margin-bottom:20px;
}

input,select,textarea{
width:100%;
padding:12px;
margin:10px 0;
border:1px solid #ccc;
border-radius:8px;
}

button{
background:#6C3EF4;
color:white;
border:none;
padding:12px;
border-radius:8px;
cursor:pointer;
width:100%;
font-size:16px;
}

button:hover{
background:#5630d8;
}

.search{
margin-bottom:20px;
}

.notes{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:15px;
}

.card{
background:white;
padding:15px;
border-radius:10px;
box-shadow:0 4px 10px rgba(0,0,0,.08);
position:relative;
}

.card h3{
color:#6C3EF4;
}

.subject{
display:inline-block;
background:#ece7ff;
padding:5px 10px;
border-radius:20px;
font-size:12px;
margin:8px 0;
}

.delete{
position:absolute;
top:10px;
right:10px;
background:red;
width:30px;
height:30px;
border-radius:50%;
border:none;
color:white;
cursor:pointer;
}
</style>

</head>
<body>

<div class="container">

<h1>📚 Smart Study Notes</h1>

<div class="form">

<input type="text" id="title" placeholder="Note Title">

<select id="subject">
<option>DBMS</option>
<option>Java</option>
<option>DSA</option>
<option>CN</option>
<option>OS</option>
</select>

<textarea id="content" rows="5" placeholder="Write your notes..."></textarea>

<button onclick="addNote()">Add Note</button>

</div>

<div class="search">
<input type="text" id="search" placeholder="Search Notes..." onkeyup="displayNotes()">
</div>

<div class="notes" id="notes"></div>

</div>

<script>

let notes = JSON.parse(localStorage.getItem("notes")) || [];

function save(){
localStorage.setItem("notes",JSON.stringify(notes));
}

function addNote(){

let title=document.getElementById("title").value;
let subject=document.getElementById("subject").value;
let content=document.getElementById("content").value;

if(title=="" || content==""){
alert("Please fill all fields");
return;
}

notes.push({
title,
subject,
content
});

save();

document.getElementById("title").value="";
document.getElementById("content").value="";

displayNotes();

}

function deleteNote(index){

notes.splice(index,1);
save();
displayNotes();

}

function displayNotes(){

let search=document.getElementById("search").value.toLowerCase();

let output="";

notes.forEach((note,index)=>{

if(
note.title.toLowerCase().includes(search) ||
note.subject.toLowerCase().includes(search) ||
note.content.toLowerCase().includes(search)
){

output+=`
<div class="card">

<button class="delete" onclick="deleteNote(${index})">×</button>

<h3>${note.title}</h3>

<div class="subject">${note.subject}</div>

<p>${note.content}</p>

</div>
`;

}

});

document.getElementById("notes").innerHTML=output;

}

displayNotes();

</script>

</body>
</html>
